name: Tauri Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generateReleaseNotes: true

  build-and-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Package legacy upgrade zip
        if: matrix.label == 'windows-x64'
        shell: pwsh
        run: |
          $releaseDir = "tauri-app/src-tauri/target/${{ matrix.target }}/release"
          $exe = Join-Path $releaseDir "ShareOneList.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Main binary not found: $exe"
            exit 1
          }
          $staging = Join-Path $env:RUNNER_TEMP "shareonelist-upgrade"
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $releaseDir "*") -Destination $staging -Recurse -Force
          $zip = Join-Path $env:RUNNER_TEMP "ShareOneList-${{ github.ref_name }}-x64.zip"
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zip -Force
          gh release upload "${{ github.ref_name }}" $zip --clobber

  publish-release:
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
